minimum_pre_commit_version: '4.0.0'
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-merge-conflict
        args: [--assume-in-merge]
        stages: [pre-commit]
      - id: detect-private-key
        stages: [pre-commit]
      - id: check-added-large-files
        args: [--maxkb=1024]
        stages: [pre-commit]
      - id: check-json
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
      - id: check-toml
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: php-syntax
        name: PHP syntax (staged files)
        language: system
        entry: node .codex/hooks/verify.mjs php-syntax
        types: [php]
        stages: [pre-commit]
      - id: project-verification
        name: Frontend build required; PHPUnit advisory
        language: system
        entry: node .codex/hooks/verify.mjs push
        pass_filenames: false
        always_run: true
        verbose: true
        stages: [pre-push]
